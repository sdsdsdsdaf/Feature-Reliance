<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="990" viewBox="0 0 1760 990" font-family="'Noto Sans CJK KR','Noto Sans CJK','Malgun Gothic',sans-serif">
  <defs>
    <marker id="fwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/>
    </marker>
    <marker id="grad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8590c"/>
    </marker>
  </defs>
  <rect width="1760" height="990" fill="#ffffff"/>

  <text x="56" y="52" font-size="31" font-weight="700" fill="#212529">제안 방법 — frozen ViT · frozen SAE 위에서 gain α만 학습</text>
  <text x="56" y="86" font-size="18" fill="#868e96">학습 파라미터는 α 하나뿐이다. weak·strong 두 view가 같은 α로 같은 경로를 통과하고, 손실은 backbone feature h′ 와 logits 에서 잰다.</text>

  <!-- ================= SECTION 1 ================= -->
  <text x="56" y="140" font-size="19" font-weight="700" fill="#495057">① 공유 경로 — 두 view 모두 이 경로를 그대로 통과한다</text>

  <text x="56" y="262" font-size="28" font-weight="700" fill="#212529">x</text>
  <path d="M 84 250 L 100 250 L 100 212 L 104 212" stroke="#495057" stroke-width="2.2" fill="none" marker-end="url(#fwd)"/>
  <path d="M 84 250 L 100 250 L 100 288 L 104 288" stroke="#495057" stroke-width="2.2" fill="none" marker-end="url(#fwd)"/>

  <rect x="112" y="186" width="128" height="52" rx="9" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/>
  <text x="176" y="218" font-size="19" fill="#495057" text-anchor="middle">weak aug</text>
  <rect x="112" y="262" width="128" height="52" rx="9" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/>
  <text x="176" y="294" font-size="19" fill="#495057" text-anchor="middle">strong aug</text>

  <path d="M 240 212 L 268 212 L 268 250 L 284 250" stroke="#495057" stroke-width="2.2" fill="none" marker-end="url(#fwd)"/>
  <path d="M 240 288 L 268 288 L 268 250" stroke="#495057" stroke-width="2.2" fill="none"/>

  <rect x="290" y="217" width="210" height="66" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/>
  <text x="395" y="246" font-size="20" fill="#495057" text-anchor="middle">ViT blk 0–10</text>
  <text x="395" y="269" font-size="15" fill="#868e96" text-anchor="middle">frozen · no_grad</text>

  <line x1="500" y1="250" x2="1256" y2="250" stroke="#495057" stroke-width="2.5"/>
  <text x="520" y="238" font-size="20" font-weight="700" fill="#212529">h</text>
  <text x="880" y="228" font-size="15" fill="#868e96" text-anchor="middle">patch 토큰에만 더한다 · prefix(CLS 1개)는 그대로 통과</text>

  <circle cx="1282" cy="250" r="24" fill="#ffffff" stroke="#495057" stroke-width="2.5"/>
  <line x1="1268" y1="250" x2="1296" y2="250" stroke="#495057" stroke-width="2.5"/>
  <line x1="1282" y1="236" x2="1282" y2="264" stroke="#495057" stroke-width="2.5"/>

  <line x1="1306" y1="250" x2="1314" y2="250" stroke="#495057" stroke-width="2.5" marker-end="url(#fwd)"/>
  <rect x="1320" y="217" width="170" height="66" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/>
  <text x="1405" y="246" font-size="20" fill="#495057" text-anchor="middle">ViT blk 11</text>
  <text x="1405" y="269" font-size="15" fill="#868e96" text-anchor="middle">frozen · grad 통과</text>

  <line x1="1490" y1="250" x2="1504" y2="250" stroke="#495057" stroke-width="2.5" marker-end="url(#fwd)"/>
  <rect x="1510" y="217" width="196" height="66" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/>
  <text x="1608" y="246" font-size="20" fill="#495057" text-anchor="middle">norm → head</text>
  <text x="1608" y="269" font-size="15" fill="#868e96" text-anchor="middle">frozen</text>
  <text x="1608" y="308" font-size="16" font-weight="700" fill="#212529" text-anchor="middle">view마다 h′ , logits 산출</text>

  <!-- SAE detour -->
  <path d="M 600 250 L 600 384" stroke="#495057" stroke-width="2.5" fill="none" marker-end="url(#fwd)"/>
  <rect x="520" y="390" width="160" height="66" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/>
  <text x="600" y="419" font-size="19" fill="#495057" text-anchor="middle">SAE encoder</text>
  <text x="600" y="442" font-size="15" fill="#868e96" text-anchor="middle">frozen</text>

  <line x1="680" y1="423" x2="702" y2="423" stroke="#495057" stroke-width="2.5" marker-end="url(#fwd)"/>
  <text x="692" y="408" font-size="19" font-weight="700" fill="#212529" text-anchor="middle">z</text>
  <rect x="708" y="390" width="150" height="66" rx="10" fill="#fff4e6" stroke="#f08c00" stroke-width="2.5"/>
  <text x="783" y="430" font-size="21" fill="#e8590c" text-anchor="middle">(α − 1) ⊙ z</text>

  <line x1="858" y1="423" x2="872" y2="423" stroke="#495057" stroke-width="2.5" marker-end="url(#fwd)"/>
  <rect x="878" y="390" width="140" height="66" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/>
  <text x="948" y="419" font-size="19" fill="#495057" text-anchor="middle">W_decᵀ</text>
  <text x="948" y="442" font-size="15" fill="#868e96" text-anchor="middle">frozen</text>

  <line x1="1018" y1="423" x2="1032" y2="423" stroke="#495057" stroke-width="2.5" marker-end="url(#fwd)"/>
  <rect x="1038" y="390" width="160" height="66" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/>
  <text x="1118" y="419" font-size="19" fill="#495057" text-anchor="middle">⊙ sd</text>
  <text x="1118" y="442" font-size="15" fill="#868e96" text-anchor="middle">역정규화</text>

  <path d="M 1198 423 L 1282 423 L 1282 280" stroke="#495057" stroke-width="2.5" fill="none" marker-end="url(#fwd)"/>
  <text x="1244" y="408" font-size="19" font-weight="700" fill="#212529" text-anchor="middle">Δh</text>

  <rect x="1310" y="378" width="330" height="44" rx="8" fill="#fff9db" stroke="#f59f00" stroke-width="1.5"/>
  <text x="1475" y="406" font-size="17" font-weight="700" fill="#e67700" text-anchor="middle">α = 1 ⟹ Δh = 0 (비트 동일 no-op)</text>

  <rect x="708" y="500" width="150" height="90" rx="11" fill="#fff4e6" stroke="#f08c00" stroke-width="3.5"/>
  <text x="783" y="534" font-size="28" font-weight="700" fill="#e8590c" text-anchor="middle">α</text>
  <text x="783" y="558" font-size="15" fill="#e8590c" text-anchor="middle">init = 1 · α ≥ 0</text>
  <text x="783" y="579" font-size="15" font-weight="700" fill="#e8590c" text-anchor="middle">★ 유일한 학습 파라미터</text>
  <line x1="783" y1="500" x2="783" y2="462" stroke="#f08c00" stroke-width="2.5" marker-end="url(#fwd)"/>

  <line x1="56" y1="622" x2="1704" y2="622" stroke="#dee2e6" stroke-width="2"/>

  <!-- ================= SECTION 2 ================= -->
  <text x="56" y="662" font-size="19" font-weight="700" fill="#495057">② 손실 조립 — weak가 pseudo-label을 만들고 strong이 그걸 맞춘다</text>

  <text x="56" y="712" font-size="18" font-weight="700" fill="#212529">weak view</text>
  <text x="56" y="734" font-size="16" fill="#868e96">h′w · logits_w</text>
  <line x1="196" y1="716" x2="284" y2="716" stroke="#495057" stroke-width="2.2" marker-end="url(#fwd)"/>

  <rect x="290" y="683" width="180" height="66" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/>
  <text x="380" y="712" font-size="18" fill="#495057" text-anchor="middle">memory bank</text>
  <text x="380" y="734" font-size="15" fill="#868e96" text-anchor="middle">클래스 균형 큐</text>

  <line x1="470" y1="716" x2="518" y2="716" stroke="#495057" stroke-width="2.2" marker-end="url(#fwd)"/>
  <rect x="524" y="683" width="176" height="66" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/>
  <text x="612" y="722" font-size="18" fill="#495057" text-anchor="middle">k-NN soft voting</text>

  <line x1="700" y1="716" x2="778" y2="716" stroke="#495057" stroke-width="2.2" marker-end="url(#fwd)"/>
  <text x="739" y="704" font-size="21" font-weight="700" fill="#212529" text-anchor="middle">ŷ</text>

  <text x="290" y="778" font-size="15" fill="#868e96">bank가 비면 softmax(logits_w)로 폴백 — buffer = 0 이 곧 in-batch 경로</text>
  <text x="290" y="800" font-size="15" font-weight="700" fill="#e8590c">weak 쪽은 detach — 개입은 받되 gradient는 흐르지 않는다</text>

  <text x="56" y="856" font-size="18" font-weight="700" fill="#212529">strong view</text>
  <text x="56" y="878" font-size="16" fill="#868e96">h′s · logits_s</text>
  <line x1="196" y1="862" x2="778" y2="862" stroke="#495057" stroke-width="2.2" marker-end="url(#fwd)"/>

  <rect x="784" y="666" width="640" height="230" rx="12" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2.5"/>
  <text x="1104" y="700" font-size="20" font-weight="700" fill="#1864ab" text-anchor="middle">AdaContrast 손실</text>
  <text x="808" y="740" font-size="18" fill="#1864ab">L_pseudo = CE( logits_s , ŷ )</text>
  <text x="808" y="774" font-size="18" fill="#1864ab">L_ctr = InfoNCE( normalize(h′s) , normalize(h′w) )</text>
  <text x="828" y="802" font-size="16" fill="#4dabf7">같은 ŷ 를 가진 샘플은 negative에서 제외</text>
  <text x="808" y="836" font-size="18" fill="#1864ab">L_div  (옵션)</text>
  <text x="808" y="872" font-size="16" fill="#4dabf7">거리 공간 { h′ | z | logit } — 기본은 h′ (실험 4B의 축)</text>

  <path d="M 1424 880 L 1490 880 L 1490 545 L 864 545" stroke="#e8590c" stroke-width="3" stroke-dasharray="10 7" fill="none" marker-end="url(#grad)"/>
  <text x="1178" y="530" font-size="19" font-weight="700" fill="#e8590c" text-anchor="middle">∂L/∂α — frozen 모듈을 통과해 흐른다 (grad_x = Wᵀ · grad_y)</text>

  <!-- legend -->
  <rect x="56" y="924" width="30" height="22" rx="5" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/>
  <text x="96" y="942" font-size="16" fill="#495057">frozen (gradient는 통과하되 weight는 갱신 안 됨)</text>
  <rect x="470" y="924" width="30" height="22" rx="5" fill="#fff4e6" stroke="#f08c00" stroke-width="2.5"/>
  <text x="510" y="942" font-size="16" fill="#495057">learnable</text>
  <line x1="640" y1="935" x2="670" y2="935" stroke="#495057" stroke-width="2.5" marker-end="url(#fwd)"/>
  <text x="680" y="942" font-size="16" fill="#495057">forward</text>
  <line x1="780" y1="935" x2="810" y2="935" stroke="#e8590c" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#grad)"/>
  <text x="820" y="942" font-size="16" fill="#495057">gradient</text>
</svg>
